# Release builds (docs/RELEASE.md). A tag vX.Y.Z (or vX.Y.Z-rcN) builds every flavor from scripts/release/build.sh
# (scripts/release/build.ps1 on Windows) in the base it was proven in, then drafts the GitHub release with SHA256SUMS,
# install.sh and install.ps1. The owner publishes the draft. workflow_dispatch builds the same archives as workflow
# artifacts and publishes nothing.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Parallel compile jobs in each build. The CUDA flavors are the long ones (see the sizing note on their jobs).
  LX_JOBS: '4'

jobs:
  release-address:
    # install.sh, `dromos update` and the image download releases from this address, built in. A rename or transfer that
    # misses one of them ships an engine that cannot find its own releases, so a release from anywhere else stops here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The built-in release address is this repository's
        run: |
          want="https://github.com/$GITHUB_REPOSITORY/releases"
          ok=1
          grep -qxF "DEFAULT_RELEASES=$want" scripts/install.sh || { echo "::error file=scripts/install.sh::DEFAULT_RELEASES is not $want"; ok=0; }
          grep -qF "kDefaultReleases = \"$want\";" engine/core/update.cpp || { echo "::error file=engine/core/update.cpp::kDefaultReleases is not $want"; ok=0; }
          grep -qxF "ARG DROMOS_RELEASES=$want" docker/Dockerfile || { echo "::error file=docker/Dockerfile::DROMOS_RELEASES is not $want"; ok=0; }
          [ "$ok" = 1 ]

  linux-x86_64-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Version and commit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "LX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "LX_GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build in the manylinux_2_28 base
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/release:/out" \
            -e LX_VERSION -e LX_GIT_SHA -e LX_JOBS quay.io/pypa/manylinux_2_28_x86_64 \
            bash -c 'export PATH=/opt/python/cp312-cp312/bin:$PATH && python3 -m pip install -q ninja && /src/scripts/release/build.sh linux-x86_64-cpu /out'
      - uses: actions/upload-artifact@v4
        with:
          name: dromos-linux-x86_64-cpu
          path: ${{ runner.temp }}/release/dromos-linux-x86_64-cpu.tar.gz
          if-no-files-found: error

  linux-aarch64-cpu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Version and commit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "LX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "LX_GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build in the manylinux_2_28 base
        run: |
          docker run --rm --platform linux/arm64 -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/release:/out" \
            -e LX_VERSION -e LX_GIT_SHA -e LX_JOBS quay.io/pypa/manylinux_2_28_aarch64 \
            bash -c 'export PATH=/opt/python/cp312-cp312/bin:$PATH && python3 -m pip install -q ninja && /src/scripts/release/build.sh linux-aarch64-cpu /out'
      - uses: actions/upload-artifact@v4
        with:
          name: dromos-linux-aarch64-cpu
          path: ${{ runner.temp }}/release/dromos-linux-aarch64-cpu.tar.gz
          if-no-files-found: error

  darwin-arm64:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Version and commit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "LX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "LX_GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build (Metal, macOS 14 target)
        run: |
          command -v ninja >/dev/null || brew install ninja
          scripts/release/build.sh darwin-arm64 "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: dromos-darwin-arm64
          path: ${{ runner.temp }}/release/dromos-darwin-arm64.tar.gz
          if-no-files-found: error

  linux-x86_64-cuda12:
    runs-on: ubuntu-24.04
    # The one CUDA build ships on CUDA 12.8: as fast as 13.4 on an RTX 5070 Ti (docs/RELEASE.md) and it runs on older
    # drivers. Every architecture took 21 minutes at 2 jobs on a 20-core server; the limit leaves room for a 4-core runner.
    timeout-minutes: 350
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v4
      - name: Version and commit
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "LX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "LX_GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Toolkit and build in the manylinux_2_28 base
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/release:/out" \
            -e LX_VERSION -e LX_GIT_SHA -e LX_JOBS -e CUDA_HOME=/usr/local/cuda-12.8 quay.io/pypa/manylinux_2_28_x86_64 \
            bash -c 'export PATH=/opt/python/cp312-cp312/bin:$PATH && python3 -m pip install -q ninja && /src/scripts/release/cuda-toolkit.sh 12.8 && /src/scripts/release/build.sh linux-x86_64-cuda12 /out'
      - uses: actions/upload-artifact@v4
        with:
          name: dromos-linux-x86_64-cuda12
          path: ${{ runner.temp }}/release/dromos-linux-x86_64-cuda12.tar.gz
          if-no-files-found: error

  windows-x86_64-cpu:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      # The checkout keeps the repository's line endings, so the zip's text files are the bytes every other archive has.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Version and commit
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "LX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "LX_GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build (MSVC, static C runtime)
        shell: pwsh
        run: scripts\release\build.ps1 windows-x86_64-cpu "$env:RUNNER_TEMP\release"
      - uses: actions/upload-artifact@v4
        with:
          name: dromos-windows-x86_64-cpu
          path: ${{ runner.temp }}/release/dromos-windows-x86_64-cpu.zip
          if-no-files-found: error

  windows-x86_64-cuda12:
    runs-on: windows-2022
    # The same CUDA 12.8 and every architecture as linux-x86_64-cuda12, with MSVC as nvcc's host compiler. The toolkit
    # comes from NVIDIA's redistributable archives (the installer does not run unattended); the limit is the Linux one.
    timeout-minutes: 350
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Version and commit
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "LX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi
          echo "LX_GIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: CUDA 12.8 toolkit
        shell: pwsh
        run: scripts\release\cuda-toolkit.ps1 12.8
      - name: Build (MSVC host compiler, static C runtime)
        shell: pwsh
        run: scripts\release\build.ps1 windows-x86_64-cuda12 "$env:RUNNER_TEMP\release"
      - uses: actions/upload-artifact@v4
        with:
          name: dromos-windows-x86_64-cuda12
          path: ${{ runner.temp }}/release/dromos-windows-x86_64-cuda12.zip
          if-no-files-found: error

  publish:
    # Only a tag publishes. A dispatch run stops at the artifacts above.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-address, linux-x86_64-cpu, linux-aarch64-cpu, darwin-arm64, linux-x86_64-cuda12, windows-x86_64-cpu,
            windows-x86_64-cuda12]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Checksums and installer
        run: |
          cp scripts/install.sh "$RUNNER_TEMP/assets/install.sh"
          cp scripts/install.ps1 "$RUNNER_TEMP/assets/install.ps1"
          scripts/release/sums.sh "$RUNNER_TEMP/assets"
      - name: Draft the release (the owner publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --draft "${prerelease[@]}" --verify-tag \
            --title "Dromos ${GITHUB_REF_NAME#v}" "$RUNNER_TEMP"/assets/*
