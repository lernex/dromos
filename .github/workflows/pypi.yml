name: PyPI

# The pip wheels of a release. Each wheel is packed from the release asset of its platform (a tarball, or the zip on
# Windows), the same bits the release workflow published, by packaging/pip/build_wheel.py, then checked and
# smoke-tested in a fresh venv.
#
# Publishing happens only for a published GitHub release, through PyPI's trusted publishing: the job asks GitHub for
# an OIDC token, and PyPI accepts it for the dromos project from this repository and workflow. No API token exists.
# A manual run builds, checks and tests the wheels for a tag and uploads nothing.
#
# Setup the owner does once (see the report that added this file): a PyPI project named dromos, and a trusted
# publisher on it for repository lernex/dromos, workflow pypi.yml, environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build the wheels for, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  # The CUDA toolkit major of the release's CUDA tarball (its name carries it); the NVIDIA wheels follow it.
  CUDA_MAJOR: "12"

jobs:
  wheels:
    name: wheel ${{ matrix.plat }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: dromos-linux-x86_64-cuda12.tar.gz
            plat: manylinux_2_28_x86_64
            cuda: true
          - runner: ubuntu-24.04-arm
            asset: dromos-linux-aarch64-cpu.tar.gz
            plat: manylinux_2_28_aarch64
            cuda: false
          - runner: macos-15
            asset: dromos-darwin-arm64.tar.gz
            plat: macosx_14_0_arm64
            cuda: false
          - runner: windows-2022
            asset: dromos-windows-x86_64-cuda12.zip
            plat: win_amd64
            cuda: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the tag and version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          # vX.Y.Z and vX.Y.Z-rcN map to the PEP 440 versions X.Y.Z and X.Y.Z rcN.
          VERSION="$(echo "${TAG#v}" | sed -E 's/-rc([0-9]+)$/rc\1/')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download the release tarball and verify it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p download && cd download
          gh release download "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ matrix.asset }}" --pattern SHA256SUMS
          grep " ${{ matrix.asset }}\$" SHA256SUMS > one.sha256
          shasum -a 256 -c one.sha256 || sha256sum -c one.sha256
      - name: Unpack the tree
        shell: bash
        run: |
          mkdir -p tree
          case "${{ matrix.asset }}" in
            *.zip) python -m zipfile -e "download/${{ matrix.asset }}" tree ;;
            *) tar -xzf "download/${{ matrix.asset }}" -C tree ;;
          esac
          # The engine is bin/dromos, or bin/dromos.exe on Windows, where the backends sit beside it.
          ENGINE=./tree/bin/dromos
          if [ "${{ runner.os }}" = "Windows" ]; then ENGINE=./tree/bin/dromos.exe; fi
          "$ENGINE" --version
          "$ENGINE" --version | grep -q "dromos ${{ steps.version.outputs.version }} " || {
            echo "the binary does not report ${{ steps.version.outputs.version }}" >&2; exit 1; }
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --quiet setuptools wheel
          CUDA_FLAG=""
          if [ "${{ matrix.cuda }}" = "true" ]; then CUDA_FLAG="--cuda $CUDA_MAJOR"; fi
          python packaging/pip/build_wheel.py --tree tree --out dist \
            --version "${{ steps.version.outputs.version }}" --plat "${{ matrix.plat }}" $CUDA_FLAG
      - name: Check the wheel
        shell: bash
        run: |
          python -m pip install --quiet twine
          python -m twine check --strict dist/*.whl
          ENGINE=dromos/_bin/bin/dromos
          if [ "${{ runner.os }}" = "Windows" ]; then ENGINE=dromos/_bin/bin/dromos.exe; fi
          python -m zipfile -l dist/*.whl | grep -q "$ENGINE"
          python -m zipfile -l dist/*.whl | grep -q "dromos-.*\.dist-info/licenses/LICENSE"
      - name: Smoke-test in a fresh venv
        shell: bash
        run: |
          python -m venv smoke
          # A venv keeps its scripts in Scripts/, with .exe names, on Windows; in bin/ elsewhere.
          BIN=smoke/bin
          EXE=
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=smoke/Scripts; EXE=.exe; fi
          "$BIN/pip$EXE" install --quiet dist/*.whl
          "$BIN/dromos$EXE" --version
          "$BIN/dromos$EXE" --version | grep -q "dromos ${{ steps.version.outputs.version }} "
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: wheels
    # Only a published release uploads. A manual run stops after the checks above.
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/dromos
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
