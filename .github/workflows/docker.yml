name: docker

# Packages a published release as the engine's container image. Publishing a GitHub release (the owner publishes the
# draft that release.yml makes) pushes ghcr.io/lernex/dromos:X.Y.Z, and :latest for a final release. A manual run builds
# the same image for a release that is already out and pushes nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'The published release to package, X.Y.Z (its assets must exist)'
        required: true

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Version and tags
        id: v
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = release ]; then v="$RELEASE_TAG"; pre="$RELEASE_PRE"; else v="$INPUT_VERSION"; pre=false; fi
          v="${v#v}"
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a release version: $v" >&2; exit 1 ;;
          esac
          tags="ghcr.io/lernex/dromos:$v"
          case "$v" in *-*) pre=true ;; esac
          if [ "$pre" != true ]; then tags="$tags"$'\n'"ghcr.io/lernex/dromos:latest"; fi
          { echo "version=$v"; echo "tags<<TAGS"; echo "$tags"; echo "TAGS"; } >> "$GITHUB_OUTPUT"

      - name: Wait for the release assets
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          url="https://github.com/lernex/dromos/releases/download/v$V/SHA256SUMS"
          for _ in $(seq 1 60); do
            if curl -fsSL -o /dev/null "$url"; then exit 0; fi
            sleep 30
          done
          echo "release v$V has no SHA256SUMS after 30 minutes" >&2
          exit 1

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            DROMOS_VERSION=${{ steps.v.outputs.version }}
            DROMOS_FLAVOR=cuda12
          tags: ${{ steps.v.outputs.tags }}
          push: ${{ github.event_name != 'workflow_dispatch' }}
